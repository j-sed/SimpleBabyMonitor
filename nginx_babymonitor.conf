# nginx site configuration for BabyMonitor
# Save as /etc/nginx/sites-available/babymonitor (then symlink to sites-enabled)
# Replace `babymonitor` with your real DNS name pointing to the Pi.

server {
    listen 80;
    server_name babymonitor;

    # Serve ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

