<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pi Camera — Live</title>
  <meta name="description" content="Simple HLS viewer for iPhone. Plays the HLS stream produced by hls_stream.py" />
  <style>
    html,body {
      height: 100%;
      margin: 0;
      background: #000;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .status {
      position: absolute;
      center: 12px;
      top: 12px;
      color: #eee;
      font-size: 13px;
      background: rgba(0,0,0,0.4);
      padding: 6px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="player" playsinline webkit-playsinline muted autoplay controls>
      <source src="/hls/stream.m3u8" type="application/vnd.apple.mpegurl">
      Your browser does not support HLS playback natively.
    </video>

    <div class="status" id="status">Connecting…</div>
  </div>

  <script>
    (function () {
      const player = document.getElementById('player');
      const statusEl = document.getElementById('status');

      let trying = 0;

      // Hide overlay once playback starts
      player.addEventListener('playing', () => {
        overlay.style.display = 'none';
        statusEl.textContent = 'Live';
      });

      player.addEventListener('waiting', () => {
        statusEl.textContent = 'Buffering…';
      });

      player.addEventListener('stalled', () => {
        statusEl.textContent = 'Stalled — reconnecting…';
      });

      player.addEventListener('error', () => {
        statusEl.textContent = 'Playback error — retrying…';
        retryLoad();
      });

      // Attempt to autoplay (muted). On iPhone autoplay with sound is blocked,
      // so we start muted and provide the overlay button for first user gesture.
      async function tryAutoplay() {
        try {
          await player.play();
          statusEl.textContent = 'Live';
          overlay.style.display = 'none';
        } catch (e) {
          // autoplay blocked — show overlay so user can tap to start & unmute
          overlay.style.display = 'flex';
          statusEl.textContent = 'Tap to play';
        }
      }

      // Retry loading the playlist with exponential backoff
      function retryLoad() {
        trying++;
        const delay = Math.min(30000, 500 * Math.pow(2, trying)); // up to 30s
        setTimeout(() => {
          try {
            // cachebust to force fresh playlist request
            const src = '/hls/stream.m3u8?cb=' + Date.now();
            // If source element exists, update it. Otherwise set player.src
            const source = player.querySelector('source');
            if (source) {
              source.src = src;
            } else {
              player.src = src;
            }
            // load and try to play
            player.load();
            player.play().catch(() => {
              overlay.style.display = 'flex';
            });
          } catch (e) {
            // schedule another retry
            retryLoad();
          }
        }, delay);
      }

      
      // kick off initial autoplay attempt
      tryAutoplay();

      // keep a light health check: if not playing after a bit, show overlay
      setTimeout(() => {
        if (player.paused || player.readyState < 3) {
          overlay.style.display = 'flex';
          statusEl.textContent = 'Tap to play';
        }
      }, 2000);

      // Make double-tap toggle fullscreen on iOS Safari (simple)
      let lastTap = 0;
      player.addEventListener('touchend', (ev) => {
        const now = Date.now();
        if (now - lastTap < 300) {
          // double tap
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(()=>{});
          } else {
            player.requestFullscreen().catch(()=>{});
          }
        }
        lastTap = now;
      });
    })();
  </script>
</body>
</html>
